name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Mengizinkan Anda menekan tombol 'Run workflow' secara manual

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Dependencies & Setup Capacitor
      run: |
        npm install
        npx cap add android
        
        # --- PROSES OTOMATIS INJECT KODE NATIVE OLEH ROBOT GITHUB ---
        mkdir -p android/app/src/main/java/com/oxid/feathera
        
        # 1. Membuat file PersistPermissionPlugin.java secara otomatis
        cat << 'EOF' > android/app/src/main/java/com/oxid/feathera/PersistPermissionPlugin.java
        package com.oxid.feathera;

        import android.content.Intent;
        import android.net.Uri;
        import com.getcapacitor.Plugin;
        import com.getcapacitor.PluginCall;
        import com.getcapacitor.PluginMethod;
        import com.getcapacitor.annotation.CapacitorPlugin;

        @CapacitorPlugin(name = "PersistPermission")
        public class PersistPermissionPlugin extends Plugin {

            @PluginMethod
            public void takePermission(PluginCall call) {
                String uriString = call.getString("uri");
                if (uriString == null) {
                    call.reject("URI kosong");
                    return;
                }

                try {
                    Uri uri = Uri.parse(uriString);
                    int takeFlags = Intent.FLAG_GRANT_READ_URI_PERMISSION;
                    getContext().getContentResolver().takePersistableUriPermission(uri, takeFlags);
                    call.resolve();
                } catch (Exception e) {
                    call.reject("Gagal mengunci file: " + e.getMessage());
                }
            }
        }
        EOF

        # 2. Memperbarui file MainActivity.java secara otomatis
        cat << 'EOF' > android/app/src/main/java/com/oxid/feathera/MainActivity.java
        package com.oxid.feathera;

        import android.os.Bundle;
        import com.getcapacitor.BridgeActivity;

        public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
                registerPlugin(PersistPermissionPlugin.class);
                super.onCreate(savedInstanceState);
            }
        }
        EOF
        # ------------------------------------------------------------

        npx @capacitor/assets generate --android
        npx cap sync android

    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Feathera-Gallery-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
