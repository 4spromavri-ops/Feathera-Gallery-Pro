name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Mengizinkan Anda menekan tombol 'Run workflow' secara manual

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Dependencies & Setup Capacitor
      run: |
        npm install
        npx cap add android
        
        # === KODE BARU: MENGUNCI KEYSTORE AGAR SHA-1 PERMANEN (DIPERBAIKI) ===
        mkdir -p ~/.android
        if [ -f "my-debug.keystore" ]; then
          echo "Keystore permanen ditemukan! Menimpa keystore default sistem..."
          cp my-debug.keystore ~/.android/debug.keystore
        else
          echo "Keystore permanen TIDAK ditemukan. Membuat file baru..."
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp ~/.android/debug.keystore ./my-debug.keystore
        fi
        # ====================================================================
        
        # Menyalin file konfigurasi Firebase ke direktori app Android agar ikut terbungkus saat kompilasi APK
        cp google-services.json android/app/google-services.json

        
        # --- PROSES OTOMATIS INJECT KODE NATIVE OLEH ROBOT GITHUB ---
        mkdir -p android/app/src/main/java/com/oxid/feathera
        
        # --- KODE BARU: PLUGIN JAVA RESOLVER ABSOLUTE PATH ---
        cat << 'EOF' > android/app/src/main/java/com/oxid/feathera/PersistPermissionPlugin.java
        package com.oxid.feathera;

        import android.app.Activity;
        import android.content.Context;
        import android.content.Intent;
        import android.database.Cursor;
        import android.net.Uri;
        import android.os.Environment;
        import android.provider.DocumentsContract;
        import android.provider.MediaStore;
        import android.provider.OpenableColumns;
        import android.content.ContentUris;
        import androidx.activity.result.ActivityResult;

        import com.getcapacitor.JSObject;
        import com.getcapacitor.Plugin;
        import com.getcapacitor.PluginCall;
        import com.getcapacitor.PluginMethod;
        import com.getcapacitor.annotation.ActivityCallback;
        import com.getcapacitor.annotation.CapacitorPlugin;

        @CapacitorPlugin(name = "PersistPermission")
        public class PersistPermissionPlugin extends Plugin {

            @PluginMethod
            public void pickFile(PluginCall call) {
                Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                intent.addCategory(Intent.CATEGORY_OPENABLE);
                intent.setType("*/*");
                startActivityForResult(call, intent, "pickFileResult");
            }

            @ActivityCallback
            private void pickFileResult(PluginCall call, ActivityResult result) {
                if (call == null) return;
                if (result.getResultCode() == Activity.RESULT_OK && result.getData() != null) {
                    Uri uri = result.getData().getData();
                    if (uri != null) {
                        try {
                            int takeFlags = Intent.FLAG_GRANT_READ_URI_PERMISSION;
                            getContext().getContentResolver().takePersistableUriPermission(uri, takeFlags);
                        } catch (Exception e) {}

                        String fileName = "unknown_file";
                        Cursor cursor = getContext().getContentResolver().query(uri, null, null, null, null);
                        if (cursor != null && cursor.moveToFirst()) {
                            int nameIndex = cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                            if (nameIndex != -1) fileName = cursor.getString(nameIndex);
                            cursor.close();
                        }

                        // INTI SOLUSI: Mengonversi URI ke Absolute Path agar bertahan dari Uninstall
                        String absolutePath = getPathFromUri(getContext(), uri);

                        JSObject ret = new JSObject();
                        if (absolutePath != null) {
                            ret.put("uri", absolutePath); // Simpan path mutlak
                        } else {
                            ret.put("uri", uri.toString()); // Fallback jika resolver gagal
                        }
                        ret.put("name", fileName);
                        call.resolve(ret);
                    } else {
                        call.reject("URI File tidak ditemukan");
                    }
                } else {
                    call.reject("Pemilihan file dibatalkan");
                }
            }

            public static String getPathFromUri(final Context context, final Uri uri) {
                if (DocumentsContract.isDocumentUri(context, uri)) {
                    if ("com.android.externalstorage.documents".equals(uri.getAuthority())) {
                        final String docId = DocumentsContract.getDocumentId(uri);
                        final String[] split = docId.split(":");
                        if ("primary".equalsIgnoreCase(split[0])) {
                            return Environment.getExternalStorageDirectory() + "/" + split[1];
                        }
                    } else if ("com.android.providers.downloads.documents".equals(uri.getAuthority())) {
                        final String id = DocumentsContract.getDocumentId(uri);
                        if (id.startsWith("raw:")) return id.replaceFirst("raw:", "");
                        try {
                            final Uri contentUri = ContentUris.withAppendedId(Uri.parse("content://downloads/public_downloads"), Long.valueOf(id));
                            return getDataColumn(context, contentUri, null, null);
                        } catch (Exception e) { return null; }
                    } else if ("com.android.providers.media.documents".equals(uri.getAuthority())) {
                        final String docId = DocumentsContract.getDocumentId(uri);
                        final String[] split = docId.split(":");
                        Uri contentUri = null;
                        if ("image".equals(split[0])) contentUri = MediaStore.Images.Media.EXTERNAL_CONTENT_URI;
                        else if ("video".equals(split[0])) contentUri = MediaStore.Video.Media.EXTERNAL_CONTENT_URI;
                        else if ("audio".equals(split[0])) contentUri = MediaStore.Audio.Media.EXTERNAL_CONTENT_URI;
                        return getDataColumn(context, contentUri, "_id=?", new String[]{split[1]});
                    }
                } else if ("content".equalsIgnoreCase(uri.getScheme())) {
                    return getDataColumn(context, uri, null, null);
                } else if ("file".equalsIgnoreCase(uri.getScheme())) {
                    return uri.getPath();
                }
                return null;
            }

            public static String getDataColumn(Context context, Uri uri, String selection, String[] selectionArgs) {
                Cursor cursor = null;
                try {
                    cursor = context.getContentResolver().query(uri, new String[]{"_data"}, selection, selectionArgs, null);
                    if (cursor != null && cursor.moveToFirst()) {
                        return cursor.getString(cursor.getColumnIndexOrThrow("_data"));
                    }
                } catch(Exception e) {
                } finally {
                    if (cursor != null) cursor.close();
                }
                return null;
            }
        }
        EOF

        # --- MENAMBAHKAN IZIN BACA PENYIMPANAN DI ANDROIDMANIFEST.XML SECARA OTOMATIS ---
        sed -i '/<application/i \
        <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" \/>\n\
        <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" \/>\n\
        <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" \/>\n\
        <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" \/>\n\
        <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" \/>\n\
        <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" \/>' android/app/src/main/AndroidManifest.xml

        # --- KODE BARU: MENDAFTARKAN PLUGIN & MEMINTA IZIN ALL FILES DI MAINACTIVITY.JAVA ---
        cat << 'EOF' > android/app/src/main/java/com/oxid/feathera/MainActivity.java
        package com.oxid.feathera;

        import android.os.Bundle;
        import android.content.Intent;
        import android.net.Uri;
        import android.os.Build;
        import android.os.Environment;
        import android.provider.Settings;
        import com.getcapacitor.BridgeActivity;
        import com.oxid.feathera.PersistPermissionPlugin;

        public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
                // SANGAT KRUSIAL: Plugin HARUS didaftarkan SEBELUM super.onCreate dipanggil
                registerPlugin(PersistPermissionPlugin.class);
                super.onCreate(savedInstanceState);

                // Meminta akses penuh ke penyimpanan untuk Android 11+ agar path absolut tetap valid setelah reinstall
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                    if (!Environment.isExternalStorageManager()) {
                        try {
                            Intent intent = new Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION);
                            intent.addCategory("android.intent.category.DEFAULT");
                            intent.setData(Uri.parse(String.format("package:%s", getApplicationContext().getPackageName())));
                            startActivityForResult(intent, 2296);
                        } catch (Exception e) {
                            Intent intent = new Intent();
                            intent.setAction(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION);
                            startActivityForResult(intent, 2296);
                        }
                    }
                }
            }
        }
        EOF

        # === KODE BARU: INJEKSI STRINGS.XML UNTUK GOOGLE AUTH NATIVE ===
        mkdir -p android/app/src/main/res/values
        cat << 'EOF' > android/app/src/main/res/values/strings.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <string name="app_name">Feathera Gallery</string>
            <string name="title_activity_main">Feathera Gallery</string>
            <string name="package_name">com.oxid.feathera</string>
            <string name="custom_url_scheme">com.oxid.feathera</string>
            <string name="server_client_id">324693466741-e69a1abhatnn8mtolggrltn4ttu1ls56.apps.googleusercontent.com</string>
        </resources>
        EOF
        # ===============================================================
        # ------------------------------------------------------------

        npx @capacitor/assets generate --android

        npx cap sync android

    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
    # --- KODE BARU DIMULAI DI SINI ---
    - name: Bongkar SHA-1 Mutlak dari APK Final
      run: |
        echo "=== SHA-1 MUTLAK DARI APK FINAL ==="
        keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep SHA1:
        echo "==================================="
    # --- KODE BARU BERAKHIR DI SINI ---

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Feathera-Gallery-APK
        path: |
          android/app/build/outputs/apk/debug/app-debug.apk
          ./my-debug.keystore
